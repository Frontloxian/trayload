<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Trayload logo: a console box with a disc sliding out of it">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B5FBF"/>
      <stop offset="1" stop-color="#1D4690"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A7BFF"/>
      <stop offset="1" stop-color="#0847C4"/>
    </linearGradient>
  </defs>

  <!-- console / VCR body -->
  <rect x="64" y="64" width="384" height="336" rx="30" fill="url(#body)"/>
  <!-- status light -->
  <circle cx="112" cy="108" r="8" fill="#9CC2FF"/>
  <!-- disc slot -->
  <rect x="104" y="334" width="304" height="16" rx="8" fill="#14336F"/>

  <!-- disc -->
  <circle cx="256" cy="372" r="124" fill="url(#disc)"/>
  <circle cx="256" cy="372" r="121" fill="none" stroke="#8DB8FF" stroke-opacity="0.55" stroke-width="3"/>
  <!-- hub ring + hole -->
  <circle cx="256" cy="372" r="46" fill="#0A3C9E"/>
  <circle cx="256" cy="372" r="26" fill="#A9B3C4"/>
  <!-- highlight arc -->
  <path d="M163.9 338.5 A98 98 0 0 1 222.5 279.9" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="9" stroke-linecap="round"/>
</svg>
