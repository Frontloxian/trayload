name: release

# Builds the Windows installer and publishes it to GitHub Releases when you push a tag like v1.0.0.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # The release notes come from the matching section of CHANGELOG.md.
      - name: Read release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $out = @()
          $on = $false
          foreach ($line in $lines) {
            if ($line -match "^##\s+v?$([regex]::Escape($version))(\s|$)") { $on = $true; continue }
            if ($on -and $line -match "^##\s") { break }
            if ($on) { $out += $line }
          }
          $body = ($out -join "`n").Trim()
          if (-not $body) { $body = "See CHANGELOG.md for what changed." }
          $delim = "EOF_" + [guid]::NewGuid().ToString("N")
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$delim"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delim

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Trayload ${{ github.ref_name }}"
          releaseBody: ${{ toJSON(steps.notes.outputs.body) }}
          releaseDraft: false
          prerelease: false
