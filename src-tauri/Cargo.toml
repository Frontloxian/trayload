[package]
name = "trayload"
version = "1.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trayload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "time"] }
futures-util = "0.3.34"
regex = "1.13.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri-plugin-dialog = "2.8.4"
base64 = "0.23.1"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
fs2 = "0.4.3"
trash = "5.4.0"
tauri-plugin-notification = "2.8.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
